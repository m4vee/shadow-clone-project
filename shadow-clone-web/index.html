<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Clone Jutsu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Shadow Clone Jutsu</h1>
      <p class="sub">Make the hand sign at your webcam. Everything runs in your browser; no video leaves your device.</p>
    </header>

    <section class="stage-wrap">
      <canvas id="stage" width="960" height="540" aria-label="Camera view with shadow clones"></canvas>
      <div id="placeholder" class="placeholder">
        <button id="start" class="primary">Start camera</button>
        <p>Your browser will ask for camera permission.</p>
      </div>
      <video id="cam" playsinline muted hidden></video>
    </section>

    <p id="status" class="status" role="status">Press Start to begin.</p>

    <section class="controls" aria-label="Controls">
      <div class="buttons">
        <button id="stop" disabled>Stop camera</button>
        <button id="spawn" disabled title="Spawn the clones without making the sign (key: S)">Test: spawn</button>
        <button id="dismiss" disabled title="Dismiss the clones (key: C)">Dismiss</button>
        <button id="debug" disabled aria-pressed="true" title="Hand skeletons and progress bars (key: D)">Debug overlay</button>
      </div>
      <div class="sliders">
        <label>Cutout threshold <output id="thrOut">0.65</output>
          <input id="thr" type="range" min="0.30" max="0.95" step="0.05" value="0.65">
        </label>
        <label>Spawn sound lead <output id="leadOut">200 ms</output>
          <input id="lead" type="range" min="0" max="500" step="25" value="200">
        </label>
      </div>
    </section>

    <section class="howto">
      <div>
        <h2>Spawn clones</h2>
        <img src="assets/images/naruto_spawnClone.png" class="spawn-clone-img"> 
      </div>
      <div>
        <h2>Release clones</h2>
        <img src="assets/images/naruto_releaseClone.png" class="release-clone-img">
      </div>
      <div>
        <h2>Keys</h2>
        <p><kbd>S</kbd> spawn · <kbd>C</kbd> dismiss · <kbd>D</kbd> debug · <kbd>I</kbd> flip cutout · <kbd>[</kbd> <kbd>]</kbd> threshold</p>
      </div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
